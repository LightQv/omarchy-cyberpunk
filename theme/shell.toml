hover-cursor-border = "#53e3d2"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.8
focus-color = "#53e3d2"
focus-fill-alpha = 0.12
focus-border = "#53e3d2"
focus-border-width = 1
focus-border-alpha = 0.9
selected-color = "#ff3045"
selected-fill-alpha = 0.18
selected-border = "#ff3045"
selected-border-width = 1
selected-border-alpha = 0.8
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#0c1015"
background-alpha = 0.98
text = "#e5f1ee"
border = "#ff3045"
