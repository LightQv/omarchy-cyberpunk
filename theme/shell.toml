size-horizontal = 29
size-vertical = 30

[hyprland]
active-border = "#ff3045"
active-border-foreground = "#53e3d2"

[controls]
normal-color = "#e5f1ee"
normal-fill-alpha = 0.04
normal-border = "#53e3d2"
